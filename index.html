  :root{
    --bg:#000000;
    --green:#ccf82c;
    --white:#ffffff;
    --muted:#8a8a8a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--white);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100%;
  }
  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:32px 20px 40px;
    text-align:center;
    background:
      radial-gradient(circle at 50% 0%, rgba(204,248,44,0.10), transparent 55%),
      var(--bg);
  }

  .logo{
    width:220px;
    max-width:60vw;
    height:auto;
    margin-bottom:8px;
    filter: drop-shadow(0 0 40px rgba(204,248,44,0.12));
  }

  h1{
    font-size:15px;
    font-weight:600;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--muted);
    margin:18px 0 6px;
  }

  p.tagline{
    font-size:17px;
    color:#d5d5d5;
    margin:0 0 36px;
    max-width:380px;
    line-height:1.5;
  }

  .buttons{
    display:flex;
    flex-direction:column;
    gap:14px;
    width:100%;
    max-width:340px;
  }

  .store-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    width:100%;
    padding:15px 20px;
    border-radius:14px;
    background:var(--white);
    color:#000;
    text-decoration:none;
    font-weight:700;
    font-size:16px;
    transition:transform .15s ease, box-shadow .15s ease;
    border:1px solid rgba(255,255,255,0.08);
  }

  .store-btn:active{
    transform:scale(0.97);
  }

  .store-btn:hover{
    box-shadow:0 0 0 2px var(--green);
  }

  .store-btn .icon{
    width:22px;
    height:22px;
    flex-shrink:0;
  }

  .store-btn .label{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    line-height:1.15;
  }

  .store-btn .label small{
    font-size:11px;
    font-weight:500;
    color:#555;
  }

  .store-btn .label strong{
    font-size:16px;
  }

  .store-btn.apple .label strong,
  .store-btn.google .label strong{
    color:#000;
  }

  .store-btn.accent{
    background:var(--green);
  }

  .social{
    margin-top:40px;
  }

  .social a{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:46px;
    height:46px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.18);
    color:var(--white);
    text-decoration:none;
    transition:border-color .15s ease, color .15s ease;
  }

  .social a:hover{
    border-color:var(--green);
    color:var(--green);
  }

  .social svg{
    width:22px;
    height:22px;
  }

  footer{
    margin-top:48px;
    font-size:12px;
    color:#555;
  }
</style>
