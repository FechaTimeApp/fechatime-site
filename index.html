<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fecha Time</title>
<meta name="description" content="Baixe o app Fecha Time. Disponível para Android e iPhone.">

<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

<meta property="og:title" content="Fecha Time">
<meta property="og:description" content="Baixe o app Fecha Time. Disponível para Android e iPhone.">
<meta property="og:image" content="logo-hero.png">
<meta property="og:type" content="website">

<style>
  :root{
    --bg:#000000;
    --green:#ccf82c;
    --white:#ffffff;
    --muted:#8a8a8a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--white);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100%;
  }
  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:32px 20px 40px;
    text-align:center;
    background:
      radial-gradient(circle at 50% 0%, rgba(204,248,44,0.10), transparent 55%),
      var(--bg);
  }

  .logo{
    width:220px;
    max-width:60vw;
    height:auto;
    margin-bottom:8px;
    filter: drop-shadow(0 0 40px rgba(204,248,44,0.12));
  }

  h1{
    font-size:15px;
    font-weight:600;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--muted);
    margin:18px 0 6px;
  }

  p.tagline{
    font-size:17px;
    color:#d5d5d5;
    margin:0 0 36px;
    max-width:380px;
    line-height:1.5;
  }

  .buttons{
    display:flex;
    flex-direction:column;
    gap:14px;
    width:100%;
    max-width:340px;
  }

  .store-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    width:100%;
    padding:15px 20px;
    border-radius:14px;
    background:var(--white);
    color:#000;
    text-decoration:none;
    font-weight:700;
    font-size:16px;
    transition:transform .15s ease, box-shadow .15s ease;
    border:1px solid rgba(255,255,255,0.08);
  }

  .store-btn:active{
    transform:scale(0.97);
  }

  .store-btn:hover{
    box-shadow:0 0 0 2px var(--green);
  }

  .store-btn .icon{
    width:22px;
    height:22px;
    flex-shrink:0;
  }

  .store-btn .label{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    line-height:1.15;
  }

  .store-btn .label small{
    font-size:11px;
    font-weight:500;
    color:#555;
  }

  .store-btn .label strong{
    font-size:16px;
  }

  .store-btn.apple .label strong,
  .store-btn.google .label strong{
    color:#000;
  }

  .store-btn.accent{
    background:var(--green);
  }

  .social{
    margin-top:40px;
  }

  .social a{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:46px;
    height:46px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.18);
    color:var(--white);
    text-decoration:none;
    transition:border-color .15s ease, color .15s ease;
  }

  .social a:hover{
    border-color:var(--green);
    color:var(--green);
  }

  .social svg{
    width:22px;
    height:22px;
  }

  footer{
    margin-top:48px;
    font-size:12px;
    color:#555;
  }
</style>
</head>
<body>

  <img class="logo" src="logo-hero.png" alt="Fecha Time">

  <p class="tagline">Baixe agora e comece a fechar o seu time.</p>

  <div class="buttons">
    <a class="store-btn apple" href="https://apps.apple.com/br/app/fecha-time/id6759315302" target="_blank" rel="noopener">
      <svg class="icon" viewBox="0 0 384 512" fill="#000"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141 0 184.3 0 272.9c0 26.2 4.8 53.3 14.4 81.2 12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-57.7-90-57.7-91.3zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
      <span class="label"><small>Baixe agora na</small><strong>App Store</strong></span>
    </a>

    <a class="store-btn google" href="https://play.google.com/store/apps/details?id=br.com.fechatime.FechaTime&hl=pt_BR" target="_blank" rel="noopener">
      <svg class="icon" viewBox="0 0 512 512"><path fill="#00d9ff" d="M325.3 234.3L104.6 13l280.8 161.2-60.1 60.1z"/><path fill="#00f076" d="M47 0c-4.6 3.7-7 9.7-7 17.4v477.2c0 7.7 2.4 13.7 7 17.4l257.3-256L47 0z"/><path fill="#ffbc00" d="M406.8 214.6L354.9 184.9 291.5 256l63.4 71.1 51.9-29.7c19.3-11.1 19.3-42.6 0-53.8z"/><path fill="#ff3a44" d="M104.6 499l280.8-161.2-60.1-60.1L104.6 499z"/></svg>
      <span class="label"><small>Disponível no</small><strong>Google Play</strong></span>
    </a>
  </div>

  <div class="social">
    <a href="https://www.instagram.com/fechatime?igsh=MXUyZDM5a2RuZHFrYg==" target="_blank" rel="noopener" aria-label="Instagram do Fecha Time">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/></svg>
    </a>
  </div>

  <footer>&copy; 2026 Fecha Time</footer>

</body>
</html>
